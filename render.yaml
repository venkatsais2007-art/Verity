# Render Blueprint for Verity. You can also set everything by hand (see DEPLOYMENT.md).
databases:
  - name: verity-db
    plan: free            # free Postgres expires after ~30 days; use a paid plan for real use
    databaseName: verity

services:
  - type: web
    name: verity
    runtime: python
    plan: free            # change to "starter" if you enable the disk below
    buildCommand: cd frontend && npm install && npm run build && cd ../Backend && pip install -r requirements.txt
    startCommand: cd Backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    # --- Persistent uploads (needs a PAID plan; free web services cannot use disks) ---
    # 1. Set plan above to "starter".
    # 2. Uncomment the disk block and the UPLOAD_DIR variable below.
    # disk:
    #   name: verity-uploads
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: verity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Password for the seeded demo users (visible in the Render dashboard > Environment).
      - key: DEMO_PASSWORD
        value: demo123
      - key: REVIEW_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
